services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: energy
      POSTGRES_DB: energy
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: energy
      RABBITMQ_DEFAULT_PASS: energy
    ports: ["5672:5672", "15672:15672"]

  emqx:
    image: emqx/emqx:5
    environment:
      EMQX_ALLOW_ANONYMOUS: "true"
    ports: ["1883:1883", "18083:18083"]

  api:
    build: ./api
    depends_on: [db, redis, rabbitmq, emqx]
    environment:
      DATABASE_URL: postgresql://energy:energy@db:5432/energy?schema=public
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://energy:energy@rabbitmq:5672
      MQTT_URL: mqtt://emqx:1883
      PORT: 3000
    ports: ["3000:3000"]
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

  simulator:
    build: ./simulator
    depends_on: [emqx]
    environment:
      MQTT_URL: mqtt://emqx:1883

  web:
    build: ./web
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
